apiVersion: apps/v1
kind: Deployment
metadata:
  name: pubsub-consumer
  namespace: keda-demo
  labels:
    app: pubsub-consumer
spec:
  # KEDA's HPA owns this field after the first apply. Re-applying this whole
  # manifest (e.g. via `kubectl apply -f`) resets it to 0 and fights the
  # HPA until the next reconcile -- if the queue has a backlog at that
  # moment, KEDA will re-scale it back up within one polling interval, but
  # don't be surprised by a brief drop to 0 replicas right after a re-apply.
  replicas: 0
  selector:
    matchLabels:
      app: pubsub-consumer
  template:
    metadata:
      labels:
        app: pubsub-consumer
    spec:
      serviceAccountName: pubsub-consumer
      nodeSelector:
        workload: keda-demo
      tolerations:
        - key: keda-demo
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: consumer
          image: us-central1-docker.pkg.dev/__PROJECT_ID__/keda-demo/consumer:latest
          env:
            - name: GCP_PROJECT_ID
              value: __PROJECT_ID__
            - name: PUBSUB_SUBSCRIPTION
              value: keda-demo-work-queue-sub
            - name: WORK_DURATION_SECONDS
              value: "5"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
